  <!-- olhos esbugalhados, cada um pra um lado -->
  <circle cx="25" cy="31" r="6" fill="#fff" stroke="#121212" stroke-width="2.5"/>
  <circle cx="39.5" cy="30" r="7" fill="#fff" stroke="#121212" stroke-width="2.5"/>
  <circle cx="23" cy="29.5" r="1.9" fill="#121212"/>
  <circle cx="42" cy="32" r="1.9" fill="#121212"/>
  <!-- boca escancarada com dentes -->
