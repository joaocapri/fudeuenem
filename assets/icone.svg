  <path d="M26.5 41.6 L37.5 41.6 L37.3 44 L26.7 44 Z" fill="#fff"/>
  <ellipse cx="32" cy="52" rx="4" ry="2.2" fill="#d93025"/>
  <!-- mãos no rosto -->
  <path d="M15 37 Q8 38 8 46 Q8 53 13 54 Q17 53 18 48 Z" fill="#fff" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
  <path d="M49 37 Q56 38 56 46 Q56 53 51 54 Q47 53 46 48 Z" fill="#fff" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
  <!-- gotas de suor voando -->
  <path d="M55 22 Q59 27 56 30 Q52.5 27 55 22 Z" fill="#fff" stroke="#121212" stroke-width="2"/>
  <path d="M8 24 Q11 28 8.5 30.5 Q5.5 28 8 24 Z" fill="#fff" stroke="#121212" stroke-width="2"/>
</svg>
